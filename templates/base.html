{% load static %}<!doctype html>
<html lang="{% block lang %}en{% endblock %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TipPool{% endblock %} | {% block site %}{{ restaurant_name }}{% endblock %}</title>
  <link rel="icon" href="{% static 'icons/tippool.svg' %}" type="image/svg+xml">
  <link rel="icon" href="{% static 'icons/icon-32.png' %}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{% static 'icons/icon-180.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="stylesheet" href="{% static 'css/inline.css' %}">
  <script nonce="{{ csp_nonce }}" src="{% static 'js/pick.js' %}" defer></script>
  <script nonce="{{ csp_nonce }}" src="{% static 'js/ui.js' %}" defer></script>
  <script nonce="{{ csp_nonce }}">try { var t = localStorage.getItem("tp-theme"); if (t === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}</script>
  {% block head %}{% endblock %}
</head>
<body{% block body_class %}{% endblock %}>
{% block body %}{% endblock %}
<dialog class="confirm-dialog" id="confirm-dialog" aria-labelledby="confirm-text">
  <form method="dialog">
    <p id="confirm-text"></p>
    <div class="confirm-actions">
      <button class="btn btn-quiet" value="no" id="confirm-no">Cancel</button>
      <button class="btn btn-primary" value="yes" id="confirm-yes">Yes, continue</button>
    </div>
  </form>
</dialog>
<script nonce="{{ csp_nonce }}">
  // "Are you sure?" in TipPool's own style. tpConfirm(text, {yes, no, danger}) resolves to true or false.
  window.tpConfirm = (text, opts = {}) => new Promise((resolve) => {
    const dialog = document.getElementById("confirm-dialog");
    if (dialog.open) { resolve(false); return; }  // one question at a time
    const yes = document.getElementById("confirm-yes"), no = document.getElementById("confirm-no");
    document.getElementById("confirm-text").textContent = text;
    yes.textContent = opts.yes || "Yes, continue";
    no.textContent = opts.no || "Cancel";
    yes.className = "btn " + (opts.danger ? "btn-danger" : "btn-primary");
    dialog.returnValue = "";
    dialog.onclose = () => resolve(dialog.returnValue === "yes");
    dialog.onclick = (e) => { if (e.target === dialog) dialog.close("no"); };  // a click outside cancels
    dialog.showModal();
    (opts.danger ? no : yes).focus();  // the safe choice is the default for things that can't be undone
  });
  // forms that undo something big ask first
  document.querySelectorAll("form[data-confirm]").forEach((f) => f.addEventListener("submit", async (e) => {
    if (f.dataset.confirmed) { delete f.dataset.confirmed; return; }
    if (e.defaultPrevented) return;  // something else (leave without saving?) asks first
    e.preventDefault();
    const ok = await window.tpConfirm(f.dataset.confirm, {yes: f.dataset.confirmYes, danger: "confirmDanger" in f.dataset});
    if (!ok) return;
    f.dataset.confirmed = "1";
    if (e.submitter) f.requestSubmit(e.submitter); else f.requestSubmit();  // keeps the clicked button's value
  }));
  // a form that was sent: its button says what's happening and can't be pressed twice
  // (runs after the confirm question above; a form whose sending was stopped is left alone)
  document.addEventListener("submit", (e) => {
    const form = e.target;
    if (e.defaultPrevented || form.hasAttribute("data-no-busy")) return;
    if (form.dataset.sending) { e.preventDefault(); return; }  // a second click while the first is on its way
    form.dataset.sending = "1";
    const button = e.submitter || form.querySelector("button:not([type=button])");
    if (!button) return;
    const label = button.dataset.busy || form.dataset.busy || "Working…";
    setTimeout(() => {  // after the browser has taken the clicked button's value
      button.dataset.idle = button.innerHTML;
      button.classList.add("is-busy");
      button.setAttribute("aria-busy", "true");
      button.disabled = true;
      button.innerHTML = '<span class="busy-spin" aria-hidden="true"></span> ';
      button.append(label);
    }, 0);
    // a download or anything that doesn't leave the page: the button comes back
    setTimeout(() => { if (document.contains(button)) restore(form, button); }, 20000);
  });
  const restore = (form, button) => {
    delete form.dataset.sending;
    if (button.dataset.idle !== undefined) { button.innerHTML = button.dataset.idle; delete button.dataset.idle; }
    button.classList.remove("is-busy");
    button.removeAttribute("aria-busy");
    button.disabled = false;
  };
  // back to a page from the browser's history: nothing is still "sending"
  window.addEventListener("pageshow", (e) => {
    if (!e.persisted) return;
    document.querySelectorAll("form[data-sending]").forEach((f) =>
      f.querySelectorAll("button.is-busy").forEach((b) => restore(f, b)));
  });
  // copyable links show their end, the part that differs between people
  document.querySelectorAll("input.copy-link").forEach((input) => { input.scrollLeft = input.scrollWidth; });
  // tables become labelled cards on phones: each cell gets its column's name
  document.querySelectorAll("table.data").forEach((table) => {
    const heads = [...table.querySelectorAll("thead th")].map((th) => th.textContent.trim());
    if (!heads.length) return;
    table.classList.add("has-labels");
    table.querySelectorAll("tbody tr").forEach((tr) => {
      [...tr.children].forEach((td, i) => { if (heads[i]) td.setAttribute("data-label", heads[i]); });
    });
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>

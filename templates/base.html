<html lang="en">

  <link rel="icon" href="{% static 'icons/tippool.svg' %}" type="image/svg+xml">

  <link rel="apple-touch-icon" href="{% static 'icons/icon-180.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">

</head>
<body>
{% block body %}{% endblock %}

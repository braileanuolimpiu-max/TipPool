{% extends "registration/_auth_simple.html" %}
{% block title %}Reset your password{% endblock %}
{% block panel %}
<form method="post" class="stack">{% csrf_token %}
  <h2>Reset your password</h2>
  <p class="muted" style="margin:0">Enter the email you sign in with. We'll send you a link to choose a new password.</p>
  <div><label for="id_email">Email</label><input type="email" name="email" id="id_email" required autocomplete="email" autofocus></div>
  <button class="btn btn-primary btn-block">Send the link</button>
  <p class="auth-switch"><a href="{% url 'login' %}">Back to sign in</a></p>
</form>
{% endblock %}

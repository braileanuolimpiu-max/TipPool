# One-click deploy on Render (free plan).
# You paste one thing in Render: DATABASE_URL (a free Neon Postgres link). Render makes the two keys itself.
# Everything else (email, Claude, PayPal, the demo, the scheduler) is set up on the website afterwards:
# sign up (the first account runs the site) and open "Platform" at the top.
services:
  - type: web
    name: tippool
    runtime: python
    plan: free
    region: oregon
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 120
    healthCheckPath: /up/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: TIPPOOL_ENCRYPTION_KEY
        generateValue: true
